openapi: 3.1.0
info:
  title: Global Mandiri Computer (GMC) API
  version: 1.0.0
  description: Authoritative REST API for Global Mandiri Computer e-commerce platform.
servers:
  - url: http://localhost:8080
    description: Local API server

paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: getHealthz
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /readyz:
    get:
      summary: Readiness probe
      operationId: getReadyz
      responses:
        '200':
          description: Service and database are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/categories:
    get:
      summary: List all product categories
      operationId: getCategories
      responses:
        '200':
          description: Flat list of categories ordered by sortOrder
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'

  /v1/brands:
    get:
      summary: List all brands
      operationId: getBrands
      responses:
        '200':
          description: List of brands with product counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Brand'

  /v1/products:
    get:
      summary: List and filter products with facets
      operationId: getProducts
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: brand
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: minPriceIdr
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: maxPriceIdr
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: inStock
          in: query
          required: false
          schema:
            type: boolean
        - name: sort
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProductSort'
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 24
      responses:
        '200':
          description: Filtered product pagination envelope with facets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/products/{slug}:
    get:
      summary: Get product details by slug
      operationId: getProductBySlug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product detail with all variants and options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/products/{slug}/related:
    get:
      summary: Get related products
      operationId: getRelatedProducts
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of up to 8 related product cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductCard'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/variants/resolve:
    get:
      summary: Resolve a variant by SKU or option values
      operationId: resolveVariant
      parameters:
        - name: sku
          in: query
          required: false
          schema:
            type: string
        - name: productSlug
          in: query
          required: false
          schema:
            type: string
        - name: optionValueIds
          in: query
          required: false
          schema:
            type: string
            description: Comma-separated option value UUIDs
      responses:
        '200':
          description: Resolved variant and product slug
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedVariant'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/cart/validate:
    post:
      summary: Validate a cart and return computed lines and issues
      operationId: validateCart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartValidateRequest'
      responses:
        '200':
          description: Cart validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartValidateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/me/cart:
    get:
      summary: Get current authenticated user's cart
      operationId: getMyCart
      responses:
        '200':
          description: User stored cart items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItemsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      summary: Replace current authenticated user's cart items
      operationId: replaceMyCart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemsRequest'
      responses:
        '204':
          description: Cart replaced successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/me/cart/merge:
    post:
      summary: Merge guest cart items into authenticated user's cart
      operationId: mergeMyCart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemsRequest'
      responses:
        '200':
          description: Merged cart validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartValidateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/checkout:
    post:
      summary: Create an order transactionally with stock reservation
      operationId: createCheckout
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Order placed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Conflict (out of stock, price changed, idempotency mismatch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/orders/{orderNo}:
    get:
      summary: Get order details by order number
      operationId: getOrderByNumber
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: query
          required: false
          schema:
            type: string
            description: Guest view token
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/auth/register:
    post:
      summary: Register a new customer account
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/auth/login:
    post:
      summary: Customer / Admin login
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/auth/refresh:
    post:
      summary: Refresh JWT access token with rotation grace
      operationId: refreshToken
      responses:
        '204':
          description: Token refreshed, new cookies issued
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/auth/logout:
    post:
      summary: Log out and invalidate session
      operationId: logoutUser
      responses:
        '204':
          description: Logged out successfully

  /v1/auth/forgot-password:
    post:
      summary: Request password reset instructions
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '204':
          description: Password reset accepted (no enumeration)

  /v1/me:
    get:
      summary: Get current authenticated user profile
      operationId: getMe
      responses:
        '200':
          description: Authenticated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      summary: Update profile details
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: New email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/me/password:
    put:
      summary: Change password and revoke other sessions
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed successfully
        '401':
          description: Current password incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /v1/me/addresses:
    get:
      summary: List user shipping addresses
      operationId: getAddresses
      responses:
        '200':
          description: List of saved addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a new shipping address
      operationId: createAddress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '201':
          description: Address created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/me/addresses/{id}:
    patch:
      summary: Update a shipping address
      operationId: updateAddress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressPatchInput'
      responses:
        '200':
          description: Address updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete an address
      operationId: deleteAddress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Address deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/me/orders:
    get:
      summary: List current user's order history
      operationId: getMyOrders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: q
          in: query
          required: false
          schema:
            type: string
            description: Order number prefix search
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 20
      responses:
        '200':
          description: Paginated user orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSummaryPagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/me/orders/{orderNo}:
    get:
      summary: Get order details by order number for current user
      operationId: getMyOrderByNumber
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/me/wishlist:
    get:
      summary: Get user wishlist products
      operationId: getMyWishlist
      responses:
        '200':
          description: Wishlist product cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductCard'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/me/wishlist/{productId}:
    put:
      summary: Add product to wishlist
      operationId: addToWishlist
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Product added to wishlist
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Remove product from wishlist
      operationId: removeFromWishlist
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Product removed from wishlist
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/contact:
    post:
      summary: Submit contact inquiry
      operationId: submitContact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactRequest'
      responses:
        '201':
          description: Contact inquiry received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/newsletter:
    post:
      summary: Subscribe to newsletter
      operationId: subscribeNewsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsletterRequest'
      responses:
        '204':
          description: Subscription received
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/site:
    get:
      summary: Get store public configuration and announcements
      operationId: getSiteInfo
      responses:
        '200':
          description: Store configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteInfo'
        '503':
          description: Store is closed for maintenance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/admin/auth/login:
    post:
      summary: Admin staff/owner login
      operationId: adminLogin
      tags:
        - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Admin login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '400':
          description: Bad request or 2FA required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLogin2FARequiredResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/admin/auth/logout:
    post:
      summary: Admin logout
      operationId: adminLogout
      tags:
        - admin
      responses:
        '204':
          description: Logged out successfully
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/admin/auth/refresh:
    post:
      summary: Refresh admin session
      operationId: adminRefresh
      tags:
        - admin
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/admin/me:
    get:
      summary: Get current authenticated admin user
      operationId: getAdminMe
      tags:
        - admin
      responses:
        '200':
          description: Current admin user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserWithPermissions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/account/password:
    put:
      summary: Update own admin password
      operationId: adminChangePassword
      tags:
        - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminChangePasswordRequest'
      responses:
        '200':
          description: Password updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/account/totp/setup:
    post:
      summary: Generate TOTP secret and backup codes
      operationId: adminTotpSetup
      tags:
        - admin
      responses:
        '200':
          description: TOTP setup details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTotpSetupResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/account/totp/enable:
    post:
      summary: Verify code and enable TOTP
      operationId: adminTotpEnable
      tags:
        - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTotpEnableRequest'
      responses:
        '200':
          description: TOTP enabled
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/account/totp/disable:
    post:
      summary: Disable TOTP
      operationId: adminTotpDisable
      tags:
        - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTotpDisableRequest'
      responses:
        '200':
          description: TOTP disabled
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/counters:
    get:
      summary: Get badge counters for admin navigation
      operationId: getAdminCounters
      tags:
        - admin
      responses:
        '200':
          description: Badge counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCounters'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  responses:
    BadRequest:
      description: Bad request or malformed body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized or token expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden or insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: Input validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    ErrorCode:
      type: string
      enum:
        - bad_request
        - validation_failed
        - unauthorized
        - token_expired
        - invalid_credentials
        - forbidden
        - not_found
        - conflict
        - email_taken
        - out_of_stock
        - price_changed
        - idempotency_conflict
        - rate_limited
        - locked
        - store_closed
        - requires_2fa
        - invalid_totp
        - insufficient_stock
        - voucher_invalid
        - voucher_expired
        - voucher_depleted
        - internal

    ErrorDetail:
      type: object
      required:
        - code
        - message
        - requestId
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          example: Data tidak valid
        requestId:
          type: string
          example: 01J9X123456789ABCDEF
        fields:
          type: object
          additionalProperties:
            type: string
          example:
            email: Email tidak valid

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'

    Brand:
      type: object
      required:
        - id
        - slug
        - name
        - productCount
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          example: fractal-design
        name:
          type: string
          example: Fractal Design
        productCount:
          type: integer
          example: 12

    Category:
      type: object
      required:
        - id
        - slug
        - name
        - parentSlug
        - productCount
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          example: pc-cases
        name:
          type: string
          example: PC Cases
        parentSlug:
          type: string
          nullable: true
          example: components
        productCount:
          type: integer
          example: 8

    ImageKind:
      type: string
      enum:
        - product
        - lifestyle
        - detail

    Image:
      type: object
      required:
