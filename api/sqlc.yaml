version: "2"
sql:
  - engine: "postgresql"
    schema: "../db/migrations"
    queries: "../db/queries"
    gen:
      go:
        package: "db"
        out: "internal/gen/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "citext"
            go_type: "string"
          - db_type: "timestamptz"
            go_type: "time.Time"
